[build-system]
requires = [
    "hatchling==1.27.0; python_version < '3.10'",
    "hatchling==1.31.0; python_version >= '3.10'",
]
build-backend = "hatchling.build"

[project]
name = "selfconnect"
dynamic = ["version"]
description = "Python client and framework adapters for SelfConnect session, budget-status, and event APIs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SelfConnect.ai", email = "sdk@selfconnect.ai" }]
keywords = ["ai", "agents", "audit-events", "cost-control", "llm", "langchain", "crewai", "autogen", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "typing_extensions>=4.0",
    "click>=8.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
mcp = ["mcp>=1.0.0"]
mcp-sse = ["mcp>=1.0.0", "starlette>=0.27", "uvicorn>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "respx>=0.20",
    "tomli>=2.0; python_version < '3.11'",
]
all = [
    "langchain-core>=0.1.0",
    "mcp>=1.0.0",
]

[project.scripts]
selfconnect = "selfconnect.cli.main:main"
selfconnect-mcp = "selfconnect.mcp.server:main"

[project.urls]
Homepage = "https://selfconnect.ai"
Documentation = "https://selfconnect.ai/docs"
Repository = "https://github.com/rblake2320/selfconnect-ecosystem/tree/main/packages/selfconnect-py"
Issues = "https://github.com/rblake2320/selfconnect-ecosystem/issues"
Security = "https://github.com/rblake2320/selfconnect-ecosystem/security/policy"
Changelog = "https://github.com/rblake2320/selfconnect-ecosystem/blob/main/LOG.md"

[tool.hatch.version]
path = "selfconnect/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["selfconnect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured disposable live API identity",
]
