name: Real-Agent Scale Readiness Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-readiness:
    name: scale-readiness
    runs-on: [self-hosted, Windows, selfconnect-readiness]
    timeout-minutes: 75
    environment: live-readiness
    env:
      PKA_ROOT: ${{ vars.READINESS_PKA_ROOT }}
      GEMINI_API_KEY: ${{ secrets.READINESS_GEMINI_API_KEY }}

    steps:
      - name: Check out scale evidence implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Require canonical protected execution context
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Scale readiness evidence must run from refs/heads/main"
          }
          if ([string]::IsNullOrWhiteSpace($env:PKA_ROOT)) {
            throw "Repository variable READINESS_PKA_ROOT is required"
          }
          if (-not [IO.Path]::IsPathFullyQualified($env:PKA_ROOT)) {
            throw "READINESS_PKA_ROOT must be an absolute path"
          }

      - name: Run and validate the real 10/15/20 scale ladder
        shell: pwsh
        run: |
          python scripts\scale_readiness.py collect `
            --core-repo (Join-Path $env:PKA_ROOT 'selfconnect') `
            --bundle (Join-Path $env:RUNNER_TEMP 'scale-readiness-evidence') `
            --report-file (Join-Path $env:RUNNER_TEMP 'scale-readiness-report.json')

      - name: Add bounded result to workflow summary
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'scale-readiness-report.json'
          if (Test-Path -LiteralPath $report) {
            "## Real-agent scale readiness" >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $report >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Preserve verified non-secret scale evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-readiness-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scale-readiness-evidence
            ${{ runner.temp }}/scale-readiness-report.json
          if-no-files-found: error
          retention-days: 30
