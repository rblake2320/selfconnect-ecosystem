name: Readiness Gate Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  readiness:
    name: readiness
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Compile readiness checker
        run: >-
          python -m py_compile
          scripts\readiness.py
          scripts\security_reference_check.py
          tests\test_readiness.py
          tests\test_security_policy.py
          tests\test_security_reference_check.py

      - name: Run readiness checker contract tests
        run: npm run test:readiness

      - name: Verify security policy contract
        run: >-
          python -m unittest discover -s tests
          -p "test_security*.py"

      - name: Resolve commit-pinned external security references
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts\security_reference_check.py SECURITY.md
